apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-operator
  namespace: diagnostic-operator-system
  labels:
    app: diagnostic-operator
spec:
  replicas: 1 # Only one "brain" needed to watch events
  selector:
    matchLabels:
      app: diagnostic-operator
  template:
    metadata:
      labels:
        app: diagnostic-operator
    spec:
      serviceAccountName: diagnostic-operator-sa # Created in Step 3 (RBAC)
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: image-registry.openshift-image-registry.svc:5000/diagnostic-operator-system/diagnostic-operator:v2.0.4
        imagePullPolicy: Always
        command:
        - /manager
        - --leader-elect=true
        - --zap-devel=false
        - --zap-encoder=json  
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 8082
          name: query-api
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        # Optional: Inject Config via Env Vars if you want to override defaults
        env:
        - name: LOG_RETENTION_HOURS
          value: "24"
        - name: KUBECONFIG
          value: ""  # Empty string uses in-cluster service account
