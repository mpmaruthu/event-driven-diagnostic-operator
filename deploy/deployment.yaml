apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-operator
  namespace: diagnostic-operator-system
  labels:
    app: diagnostic-operator
spec:
  replicas: 1 # Only one "brain" needed to watch events
  selector:
    matchLabels:
      app: diagnostic-operator
  template:
    metadata:
      labels:
        app: diagnostic-operator
    spec:
      serviceAccountName: diagnostic-operator-sa # Created in Step 3 (RBAC)
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: quay.io/your-org/diagnostic-operator:v1 # The image you built above
        imagePullPolicy: Always
        command:
        - /manager
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        # Optional: Inject Config via Env Vars if you want to override defaults
        env:
        - name: LOG_RETENTION_HOURS
          value: "24"